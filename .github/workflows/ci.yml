name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces its in-progress run. Each push to
# main gets its own group, so every main commit keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guardrails:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fail on tracked local artifacts
        shell: bash
        run: |
          set -euo pipefail

          forbidden='(^|/)(.*\.db|.*\.sqlite|.*\.sqlite3|.*-journal|.*-wal|.*-shm|\.env(\..*)?|mcp_browser_clients\.local\.json)$'
          matches="$(git ls-files | grep -E "$forbidden" || true)"

          if [ -n "$matches" ]; then
            echo "Forbidden tracked files detected:"
            echo "$matches"
            exit 1
          fi

  # Ruff does not need the project installed, so this reports before the
  # test jobs finish installing torch.
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the Ruff version pinned in pyproject.toml
        shell: bash
        run: |
          ruff_pin=$(python -c "import tomllib; print(next(d for d in tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['dev'] if d.startswith('ruff==')))")
          python -m pip install "$ruff_pin"

      - name: Check formatting
        run: ruff format --check .

      - name: Run linter
        run: ruff check .

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # Pinned so an upstream MkDocs release cannot break unrelated pull requests.
      - name: Install MkDocs
        run: python -m pip install mkdocs==1.6.1 mkdocs-material==9.7.7 pymdown-extensions==12.1

      - name: Build documentation
        run: python -m mkdocs build --strict

  test:
    needs: guardrails
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install PortAudio on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 portaudio19-dev pulseaudio

      # Newer runner images make PortAudio fail on import without a PulseAudio
      # server, so start one with a silent output device.
      - name: Start dummy PulseAudio server on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=dummy
          pactl info

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      # Windows only: the winrt imports do not resolve on other platforms.
      - name: Check types
        if: runner.os == 'Windows'
        shell: bash
        run: ty check --python "$(python -c 'import sys; print(sys.executable)')"

      - name: Check wheel install
        if: runner.os == 'Windows'
        run: python tools/check_wheel_install.py
