name: CI

on:
  push:
  pull_request:

jobs:
  guardrails:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fail on tracked local artifacts
        shell: bash
        run: |
          set -euo pipefail

          forbidden='(^|/)(.*\.db|.*\.sqlite|.*\.sqlite3|.*-journal|.*-wal|.*-shm|\.env(\..*)?|mcp_browser_clients\.local\.json)$'
          matches="$(git ls-files | grep -E "$forbidden" || true)"

          if [ -n "$matches" ]; then
            echo "Forbidden tracked files detected:"
            echo "$matches"
            exit 1
          fi

  test:
    needs: guardrails
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PortAudio on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 portaudio19-dev pulseaudio

      # Newer runner images make PortAudio fail on import without a PulseAudio
      # server, so start one with a silent output device.
      - name: Start dummy PulseAudio server on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=dummy
          pactl info

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Run linter
        run: ruff check .

      - name: Run tests
        run: pytest
